<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>For My Valentine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-hearts" id="bg-hearts"></div>

    <div class="container">
        <div id="question-screen">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGIwZHIxN3Z5eG15ZGJ4amZweXMyNHV4OTJ5bm14ZnR4eWw0YmJ0ZiZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/iCVzZwwE6QNAV2tEE0/giphy.gif" alt="Cute Bear" class="sticker">
            </div>
            
            <h1 class="header_text">Will you be my Valentine?</h1>
            <p class="sub_text">It would make me the happiest person alive! 🌹</p>

            <div class="buttons">
                <button class="btn" id="yesBtn">Yes</button>
                <button class="btn" id="noBtn">No</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <h1 class="header_text">Knew you'd say Yes! ❤️</h1>
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2FyaWtpZDNrZnFpcmw0NDBoZGlmYm9tMmM3cnBsaGQ5c2pvd2RncCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/gRSqTmhQ3ayroAQ04S/giphy.gif" alt="Celebrate" class="sticker">
            </div>
            <p class="sub_text">I love you so much! Happy Valentine's Day!</p>
            
            <div class="gallery">
                <img src="us1.jpg" alt="Photo 1">
                <img src="us2.jpg" alt="Photo 2">
                <img src="us3.jpg" alt="Photo 3">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
